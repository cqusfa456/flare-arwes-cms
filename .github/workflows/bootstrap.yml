name: Bootstrap CMS admin

# Creates (or resets) the CMS administrator in the deployed D1 database, then
# proves the deployment actually works.
#
# Why this exists as a workflow: creating the first admin needs D1 access, the
# public POST /auth/seed-admin is disabled unless ALLOW_SEED_ADMIN is set (it
# hard-codes a password and resets an existing admin), and a local run of
# scripts/create-admin.mjs needs Cloudflare credentials on the machine. Running
# it here uses the repository's own CF_API_TOKEN, so nothing has to be installed
# or pasted locally.
#
# Required repository secret:
#   SCIFI_ADMIN_PASSWORD — password for the admin account (min 8 characters).
#                          Repository secrets are masked in the logs.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: Administrator email
        required: true
        default: admin@arwes.dev
        type: string
      admin_username:
        description: Administrator username
        required: false
        default: admin
        type: string
      site_url:
        description: Deployed CMS URL
        required: false
        default: https://sci-fi-cms.cqusfa.workers.dev
        type: string
      expect_storage:
        description: Storage backend the health check must report (b2 / s3 / r2)
        required: false
        default: b2
        type: string

jobs:
  bootstrap:
    name: Create admin and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      # One credential for every Cloudflare call below (see
      # scripts/ci-cf-credential.sh).
      - name: Resolve the Cloudflare credential
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash scripts/ci-cf-credential.sh

      - name: Install CMS dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check the admin password secret
        run: |
          if [ -z "${{ secrets.SCIFI_ADMIN_PASSWORD }}" ]; then
            echo "::error::SCIFI_ADMIN_PASSWORD is not set. Add it under Settings → Secrets and variables → Actions (min 8 characters) and run this again — or create the admin from node scripts/setup-tui.mjs instead."
            exit 1
          fi

      - name: Create or update the administrator
        working-directory: cms/packages/cms
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_CREDENTIAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SCIFI_ADMIN_PASSWORD: ${{ secrets.SCIFI_ADMIN_PASSWORD }}
          # Passed through the environment rather than interpolated into the
          # command line, so an input cannot alter the statement.
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
        run: |
          set -euo pipefail
          node "${{ github.workspace }}/scripts/create-admin.mjs" \
            --email "$ADMIN_EMAIL" \
            --username "$ADMIN_USERNAME" \
            --database sci-fi-cms-db

      # Everything below needs the Worker to have answered at least one request,
      # because the runtime applies pending migrations on request.
      - name: Verify the deployment
        env:
          SITE_URL: ${{ inputs.site_url }}
          EXPECT_STORAGE: ${{ inputs.expect_storage }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ secrets.SCIFI_ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ env.CF_CREDENTIAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          echo "== HTTP =="
          root_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/")
          login_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/auth/login")
          echo "GET /            -> $root_code"
          echo "GET /auth/login  -> $login_code"
          if [ "$login_code" != "200" ]; then
            echo "::error::$SITE_URL/auth/login returned $login_code; the Worker is not serving the admin UI"
            exit 1
          fi

          echo "== health =="
          curl -s --max-time 30 "$SITE_URL/api/system/health" -o /tmp/health.json
          cat /tmp/health.json
          echo
          python3 - "$EXPECT_STORAGE" <<'PY'
          import json, sys
          expected = sys.argv[1]
          data = json.load(open('/tmp/health.json'))
          checks = data.get('checks', {})
          storage = checks.get('storage', {})
          problems = []
          if checks.get('database', {}).get('status') != 'healthy':
              problems.append(f"database is {checks.get('database', {}).get('status')}")
          if storage.get('provider') != expected:
              problems.append(f"storage provider is {storage.get('provider')}, expected {expected}")
          if storage.get('status') != 'healthy':
              problems.append(f"storage is {storage.get('status')} ({storage.get('error', '')})")
          if problems:
              print('::error::health check failed: ' + '; '.join(problems))
              sys.exit(1)
          print(f"health ok: database healthy, storage {expected} healthy")
          PY

          echo "== runtime migrations =="
          cd cms/packages/cms
          npx wrangler d1 execute sci-fi-cms-db --remote --json \
            --command "SELECT COUNT(*) AS applied FROM migrations;" > /tmp/migrations.json
          cat /tmp/migrations.json
          echo
          python3 - <<'PY'
          import json, sys
          raw = open('/tmp/migrations.json').read()
          start = raw.find('[')
          data = json.loads(raw[start:]) if start >= 0 else []
          rows = data[0].get('results', []) if data else []
          applied = rows[0].get('applied') if rows else 0
          if not applied:
              print('::error::no migrations recorded — the Worker never applied its runtime migrations')
              sys.exit(1)
          print(f"runtime migrations applied: {applied}")
          PY

          echo "== admin login =="
          login=$(curl -s --max-time 30 -X POST "$SITE_URL/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          if printf '%s' "$login" | grep -q '"token"'; then
            echo "admin login ok ($ADMIN_EMAIL)"
          else
            echo "::error::admin login failed: $(printf '%s' "$login" | head -c 300)"
            exit 1
          fi

          echo "✅ $SITE_URL serves the admin UI, storage is $EXPECT_STORAGE, migrations ran, and the admin can sign in."
