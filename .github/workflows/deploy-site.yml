name: Deploy site

# Generic, site-agnostic deploy job for CMS-managed sites.
#
# The CMS dispatches this workflow from Admin → Sites ("Deploy via GitHub
# Actions") with the site's own build contract as inputs, so the CMS stays the
# single source of truth for how a site is built and where it is deployed —
# and Cloudflare never needs a Git connection to the site.
#
# Why this exists: Cloudflare cannot build an Astro app inside a Worker
# (Workers Builds is a Git integration, and a Worker has no build toolchain), so
# a Git-less setup needs *somewhere* to run the build. This workflow is that
# place, and it deploys by direct upload:
#   * cloudflare-worker → `wrangler deploy` (assets upload API)
#   * cloudflare-pages  → `wrangler pages deploy` (Direct Upload, no Git needed)
# Both keep the site's own traffic on free static-asset serving.
#
# Content: the build reads the CMS API at build time. That API is public for
# published content and scopes by `X-Site`, so no API token is required —
# PUBLIC_SCIFI_API_URL and PUBLIC_SCIFI_SITE are enough. (Set SCIFI_API_TOKEN to
# send an X-API-Key anyway; an *invalid* one is rejected with 401.)

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site slug registered in the CMS (sent as PUBLIC_SCIFI_SITE / X-Site)
        required: true
        type: string
      provider:
        description: Hosting provider the CMS recorded for this site
        required: true
        type: choice
        options:
          - cloudflare-worker
          - cloudflare-pages
      build_command:
        description: Command that produces the static output (run in root_directory)
        required: true
        type: string
      deploy_command:
        description: Command that uploads the output (wrangler deploy / wrangler pages deploy)
        required: true
        type: string
      root_directory:
        description: Directory the commands run in, relative to the repository root ("." for the root)
        required: false
        default: "."
        type: string
      pages_project:
        description: Pages project name — created automatically if missing (cloudflare-pages only)
        required: false
        default: ""
        type: string
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string
      node_version:
        description: Node.js version (Astro 7 requires >= 22.12; the CMS sends the site's recorded nodeVersion)
        required: false
        default: "22"
        type: string

# One deploy per site at a time: two uploads racing would publish whichever
# finished last, which is rarely what was intended.
concurrency:
  group: deploy-site-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy ${{ inputs.site }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarise the dispatched build
        run: |
          echo "site            : ${{ inputs.site }}"
          echo "provider        : ${{ inputs.provider }}"
          echo "build_command   : ${{ inputs.build_command }}"
          echo "deploy_command  : ${{ inputs.deploy_command }}"
          echo "root_directory  : ${{ inputs.root_directory }}"
          echo "ref             : ${{ inputs.ref }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The monorepo builds the CMS workspace with pnpm and the ARWES packages
      # with npm, so both toolchains have to be present.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      # One credential for every Cloudflare call below (see
      # scripts/ci-cf-credential.sh).
      - name: Resolve the Cloudflare credential
        env:
          CF_REFRESH_TOKEN: ${{ secrets.CF_REFRESH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: bash scripts/ci-cf-credential.sh

      - name: Check the CMS API URL is configured
        run: |
          # SCIFI_API_URL is the current secret. FLARE_API_URL is the pre-rename
          # name, still accepted until it is deleted from the repository.
          if [ -z "${{ secrets.SCIFI_API_URL || secrets.FLARE_API_URL }}" ]; then
            echo "::error::SCIFI_API_URL secret is not set. Without it the build falls back to http://localhost:8787 and publishes empty content."
            exit 1
          fi

      # The build reads published content from the CMS for exactly this site.
      - name: Build
        working-directory: ${{ inputs.root_directory }}
        env:
          PUBLIC_SCIFI_API_URL: ${{ secrets.SCIFI_API_URL || secrets.FLARE_API_URL }}
          PUBLIC_SCIFI_API_TOKEN: ${{ secrets.SCIFI_API_TOKEN || secrets.FLARE_API_TOKEN }}
          PUBLIC_SCIFI_SITE: ${{ inputs.site }}
        run: ${{ inputs.build_command }}

      # A Pages project does not have to be created by hand first: `wrangler
      # pages deploy` needs the project to exist, so create it here and let the
      # deploy command reference it through $PAGES_PROJECT.
      #
      # Only "already exists" is tolerated. A blanket `|| true` would swallow an
      # authentication/permission failure and push the confusing error into the
      # deploy step, which is exactly what happened the first time this ran with
      # a token that had no Pages permission.
      - name: Ensure the Pages project exists
        if: inputs.provider == 'cloudflare-pages' && inputs.pages_project != ''
        working-directory: ${{ inputs.root_directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_CREDENTIAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ inputs.pages_project }}
          DEPLOY_BRANCH: ${{ inputs.ref }}
        run: |
          echo "Ensuring Pages project \"$PAGES_PROJECT\" exists (production branch: $DEPLOY_BRANCH)"
          out=$(cms/packages/cms/node_modules/.bin/wrangler pages project create "$PAGES_PROJECT" \
            --production-branch "$DEPLOY_BRANCH" 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Created Pages project \"$PAGES_PROJECT\"."
            exit 0
          fi
          echo "$out"
          if printf '%s' "$out" | grep -qiE 'already exists|already been taken|duplicate'; then
            echo "Project already exists — continuing."
            exit 0
          fi
          echo "::error::Could not ensure the Pages project. If the output above is an authentication error (code 10000), the API token is missing the Pages permission: it needs 'Pages: Edit' at account scope. Create a token that includes it with: node scripts/set-cf-token.mjs  (then update the CF_API_TOKEN secret)."
          exit 1

      # Direct upload: no Cloudflare-side Git connection, no Deploy Hook.
      - name: Deploy
        working-directory: ${{ inputs.root_directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_CREDENTIAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PUBLIC_SCIFI_API_URL: ${{ secrets.SCIFI_API_URL || secrets.FLARE_API_URL }}
          PUBLIC_SCIFI_SITE: ${{ inputs.site }}
          # Available to the deploy command so it stays site-agnostic:
          #   wrangler pages deploy ./build --project-name="$PAGES_PROJECT" --branch="$DEPLOY_BRANCH"
          PAGES_PROJECT: ${{ inputs.pages_project }}
          DEPLOY_BRANCH: ${{ inputs.ref }}
          SITE_SLUG: ${{ inputs.site }}
          DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          SITE_PROVIDER: ${{ inputs.provider }}
        run: |
          set +e
          eval "$DEPLOY_COMMAND"
          status=$?
          if [ "$status" -ne 0 ] && [ "$SITE_PROVIDER" = "cloudflare-pages" ]; then
            echo "::error::The Pages upload failed. A Cloudflare API 'Authentication error [code: 10000]' here means the API token lacks 'Pages: Edit' (account scope) — create one with 'node scripts/set-cf-token.mjs' and update the CF_API_TOKEN secret. If it instead says the project is missing, check \$PAGES_PROJECT ($PAGES_PROJECT)."
          fi
          exit $status

      - name: Result
        if: success()
        run: |
          echo "✅ ${{ inputs.site }} built and deployed (${{ inputs.provider }})."
          echo "Custom domains are managed from Admin → Sites; they are unaffected by a deploy."
