name: Deploy to Cloudflare

on:
  push:
    branches: [next, main]
  workflow_dispatch:

# All credentials are stored as GitHub Actions secrets (never in the repo).
# Required GitHub secrets (set via: node scripts/setup-tui.mjs → GitHub step,
# or manually in Settings → Secrets and variables → Actions):
#   CF_API_TOKEN          — Cloudflare API token (Workers Scripts: Edit,
#                           Pages: Edit, D1, R2, KV permissions)
#   CF_ACCOUNT_ID         — Cloudflare account ID
#   CF_D1_DATABASE_ID     — D1 database ID (create: wrangler d1 create)
#   CF_R2_BUCKET_NAME     — R2 bucket name (create: wrangler r2 bucket create)
#   CF_KV_NAMESPACE_ID    — KV namespace ID (create: wrangler kv namespace create)
#   JWT_SECRET            — CMS auth secret
#   FLARE_API_URL         — deployed CMS worker URL
#   FLARE_API_TOKEN       — (optional) read-only CMS API token
#   PAGES_PROJECT_NAME    — (optional) Pages project name, default: arwes-docs
# B2 storage (optional — only when using Backblaze B2 instead of R2):
#   STORAGE_BACKEND       — set to "b2" to enable
#   B2_ENDPOINT           — B2 S3-compatible endpoint
#   B2_BUCKET             — B2 private bucket name
#   B2_ACCESS_KEY_ID      — B2 application key ID
#   B2_SECRET_ACCESS_KEY  — B2 application key secret
#   B2_REGION             — (optional) B2 bucket region, default: us-west-004

jobs:
  deploy-cms:
    name: Deploy CMS Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install CMS dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build core
        working-directory: cms
        run: pnpm build

      - name: Build astro integration
        working-directory: cms/packages/astro
        run: pnpm build

      # Inject all private values from GitHub secrets into the local
      # (ephemeral) wrangler.toml for this build. Nothing is persisted.
      - name: Configure Cloudflare resources from secrets
        working-directory: cms/packages/cms
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_REGION: ${{ secrets.B2_REGION }}
        run: |
          if [ -z "${{ secrets.CF_D1_DATABASE_ID }}" ]; then
            echo "::error::CF_D1_DATABASE_ID secret is required. Create a D1 database with 'wrangler d1 create' and add its ID as a secret."
            exit 1
          fi
          if [ "${{ secrets.STORAGE_BACKEND }}" != "b2" ] && [ -z "${{ secrets.CF_R2_BUCKET_NAME }}" ]; then
            echo "::error::CF_R2_BUCKET_NAME secret is required (or set STORAGE_BACKEND=b2 to use Backblaze)."
            exit 1
          fi
          if [ -z "${{ secrets.CF_KV_NAMESPACE_ID }}" ]; then
            echo "::error::CF_KV_NAMESPACE_ID secret is required. Create a KV namespace with 'wrangler kv namespace create' and add its ID as a secret."
            exit 1
          fi
          sed -i "s/database_id = \"[^\"]*\"/database_id = \"${{ secrets.CF_D1_DATABASE_ID }}\"/g" wrangler.toml
          # 注意：此行必须用行首锚定 ^，否则会误伤 database_id 行中的 “id = " 子串
          sed -i "s/^id = \"[^\"]*\"/id = \"${{ secrets.CF_KV_NAMESPACE_ID }}\"/g" wrangler.toml

          # B2 storage backend (optional, from secrets) — B2 模式下移除 R2 binding
          if [ "${{ secrets.STORAGE_BACKEND }}" = "b2" ]; then
            if [ -z "${{ secrets.B2_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.B2_SECRET_ACCESS_KEY }}" ]; then
              echo "::error::STORAGE_BACKEND=b2 requires B2_ACCESS_KEY_ID and B2_SECRET_ACCESS_KEY secrets."
              exit 1
            fi
            # B2 模式下：移除所有 R2 binding + 注入 B2 变量（独立脚本，环境变量传值）
            python3 "${{ github.workspace }}/scripts/b2-config.py" wrangler.toml
            if [ $? -ne 0 ]; then
              echo "::error::b2-config.py failed"
              exit 1
            fi

          else
            sed -i "s/bucket_name = \"[^\"]*\"/bucket_name = \"${{ secrets.CF_R2_BUCKET_NAME }}\"/g" wrangler.toml
          fi

          # JWT_SECRET for the production worker
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::warning::JWT_SECRET secret not set. CMS auth will use a default value."
          fi
          echo "Cloudflare resources configured from secrets"

      - name: Run D1 migrations
        working-directory: cms/packages/cms
        run: npx wrangler d1 migrations apply DB --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy CMS to Cloudflare Workers
        working-directory: cms/packages/cms
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Set the JWT_SECRET as an encrypted Worker secret (never in repo).
      - name: Set JWT_SECRET worker secret
        working-directory: cms/packages/cms
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env production
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-docs:
    name: Deploy Docs Site to Pages
    needs: deploy-cms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      # Build @flare-cms/astro first so the file: dependency in apps/docs
      # picks up the built dist during npm install.
      - name: Build astro integration
        working-directory: cms
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm --filter @flare-cms/astro build

      # 构建 ARWES packages（apps/docs 通过 workspace 链接引用其 build 产物）
      # 注意：不要用 turbo 全量 build（会连带构建 apps/docs，而 flare-loader
      # 此时拿不到 PUBLIC_FLARE_API_URL，导致 docs 构建失败）。
      - name: Install and build ARWES packages
        run: |
          npm install --engine-strict=false
          npx turbo build --filter='./packages/*'
        env:
          HUSKY: 0

      - name: Build docs site
        working-directory: apps/docs
        shell: bash
        run: |
          # The docs site fetches CMS content at build time. Without a
          # deployed CMS URL the build still succeeds but CMS-managed
          # pages are skipped, so warn loudly instead.
          if [ -z "${{ secrets.FLARE_API_URL }}" ]; then
            echo "::warning::FLARE_API_URL secret not set. CMS-managed pages will be skipped."
          fi
          npm run build
        env:
          PUBLIC_FLARE_API_URL: ${{ secrets.FLARE_API_URL }}
          PUBLIC_FLARE_API_TOKEN: ${{ secrets.FLARE_API_TOKEN }}

      # Create the Pages project on first deploy (ignore "already exists").
      - name: Create Pages project
        working-directory: apps/docs
        run: |
          ../../cms/packages/cms/node_modules/.bin/wrangler pages project create ${{ secrets.PAGES_PROJECT_NAME || 'arwes-docs' }} --production-branch next || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        working-directory: apps/docs
        run: ../../cms/packages/cms/node_modules/.bin/wrangler pages deploy ./build --project-name ${{ secrets.PAGES_PROJECT_NAME || 'arwes-docs' }} --branch ${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
