name: Deploy to Cloudflare

on:
  push:
    branches: [next, main]
  workflow_dispatch:

# All credentials are stored as GitHub Actions secrets (never in the repo).
# Required GitHub secrets (set via: node scripts/setup-tui.mjs → GitHub step,
# or manually in Settings → Secrets and variables → Actions):
#   CF_API_TOKEN          — Cloudflare API token (Workers Scripts: Edit,
#                           Pages: Edit, D1, R2, KV permissions)
#   CF_ACCOUNT_ID         — Cloudflare account ID
#   CF_D1_DATABASE_ID     — D1 database ID (create: wrangler d1 create)
#   CF_R2_BUCKET_NAME     — R2 bucket name (create: wrangler r2 bucket create)
#   CF_KV_NAMESPACE_ID    — KV namespace ID (create: wrangler kv namespace create)
#   JWT_SECRET            — CMS auth secret
#   FLARE_API_URL         — deployed CMS worker URL
#   FLARE_API_TOKEN       — (optional) read-only CMS API token
#   PAGES_PROJECT_NAME    — (optional) Pages project name, default: arwes-docs
# Storage backend (optional — only when using an S3-compatible backend
# instead of R2). STORAGE_BACKEND selects the provider:
#   STORAGE_BACKEND=b2  → required: B2_BUCKET, B2_ACCESS_KEY_ID,
#                         B2_SECRET_ACCESS_KEY; optional: B2_ENDPOINT, B2_REGION
#   STORAGE_BACKEND=s3  → required: S3_BUCKET, S3_ACCESS_KEY_ID,
#                         S3_SECRET_ACCESS_KEY; optional: S3_ENDPOINT,
#                         S3_REGION, S3_FORCE_PATH_STYLE
# Either way the R2 binding is removed from the ephemeral wrangler.toml.

jobs:
  deploy-cms:
    name: Deploy CMS Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install CMS dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build core
        working-directory: cms
        run: pnpm build

      - name: Build astro integration
        working-directory: cms/packages/astro
        run: pnpm build

      # Inject all private values from GitHub secrets into the local
      # (ephemeral) wrangler.toml for this build. Nothing is persisted.
      - name: Configure Cloudflare resources from secrets
        working-directory: cms/packages/cms
        env:
          # Exported so scripts/storage-config.py can read the selected provider.
          STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_REGION: ${{ secrets.B2_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
        run: |
          if [ -z "${{ secrets.CF_D1_DATABASE_ID }}" ]; then
            echo "::error::CF_D1_DATABASE_ID secret is required. Create a D1 database with 'wrangler d1 create' and add its ID as a secret."
            exit 1
          fi
          if [ "$STORAGE_BACKEND" != "b2" ] && [ "$STORAGE_BACKEND" != "s3" ] && [ -z "${{ secrets.CF_R2_BUCKET_NAME }}" ]; then
            echo "::error::CF_R2_BUCKET_NAME secret is required (or set STORAGE_BACKEND=b2/s3 to use an S3-compatible backend)."
            exit 1
          fi
          if [ -z "${{ secrets.CF_KV_NAMESPACE_ID }}" ]; then
            echo "::error::CF_KV_NAMESPACE_ID secret is required. Create a KV namespace with 'wrangler kv namespace create' and add its ID as a secret."
            exit 1
          fi
          sed -i "s/database_id = \"[^\"]*\"/database_id = \"${{ secrets.CF_D1_DATABASE_ID }}\"/g" wrangler.toml
          # 注意：此行必须用行首锚定 ^，否则会误伤 database_id 行中的 “id = " 子串
          sed -i "s/^id = \"[^\"]*\"/id = \"${{ secrets.CF_KV_NAMESPACE_ID }}\"/g" wrangler.toml

          # Non-R2 storage backend (optional, from secrets). Removes the R2
          # binding and injects STORAGE_BACKEND + the provider's variables.
          if [ "$STORAGE_BACKEND" = "b2" ] || [ "$STORAGE_BACKEND" = "s3" ]; then
            python3 "${{ github.workspace }}/scripts/storage-config.py" wrangler.toml || exit 1

          else
            sed -i "s/bucket_name = \"[^\"]*\"/bucket_name = \"${{ secrets.CF_R2_BUCKET_NAME }}\"/g" wrangler.toml
          fi

          # JWT_SECRET for the production worker
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "::warning::JWT_SECRET secret not set. CMS auth will use a default value."
          fi
          echo "Cloudflare resources configured from secrets"

      # Smoke test only — this does NOT migrate production.
      #
      # Production migrations are applied by the CMS itself: the Worker bundles
      # every migrations/*.sql (src/db/migrations-bundle.ts, regenerated on
      # prebuild) and bootstrapMiddleware calls
      # MigrationService(c.env.DB).runPendingMigrations() on request, tracking
      # state in its own `migrations` table and tolerating "already exists" /
      # "duplicate column name" so re-runs are safe.
      #
      # Deliberately NOT using --remote here: that would add a second mechanism
      # with a separate tracking table (wrangler's d1_migrations) and make this
      # step a hard failure point, while the runtime path already owns schema.
      - name: Check migrations apply (local)
        working-directory: cms/packages/cms
        run: npx wrangler d1 migrations apply DB --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy CMS to Cloudflare Workers
        working-directory: cms/packages/cms
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # Set the JWT_SECRET as an encrypted Worker secret (never in repo).
      - name: Set JWT_SECRET worker secret
        working-directory: cms/packages/cms
        run: |
          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET --env production
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

# NOTE: this workflow deploys ONLY the CMS Worker.
#
# Site builds are owned by the CMS itself: each site is registered in
# Admin → Sites with its hosting target (a Worker with static assets, or a
# Cloudflare Pages project) and a Deploy Hook, and rebuilding is triggered from
# there. See cms/packages/core/src/services/sites.ts.
#
# Previously a `deploy-docs` job built ./apps/docs and ran `wrangler pages
# deploy` here. It was removed so that all sites — their build config, domain
# bindings and content — are managed from one control plane instead of being
# spread across this workflow.
#
# Setup required once per site in Cloudflare. For the docs Worker
# (apps/docs/wrangler.jsonc, name `arwes-docs-worker`):
#   1. Connect the Worker to this Git repository: Worker → Settings → Builds.
#   2. Create a Workers Builds trigger with
#        build_command  : sh ./apps/docs/scripts/build-worker.sh
#        deploy_command : cd apps/docs && ../../cms/packages/cms/node_modules/.bin/wrangler deploy
#        root_directory : /
#      (the CMS can push build/deploy command + root directory from Admin → Sites
#      → "Push build config to Cloudflare").
#   3. Create a Deploy Hook under the same Settings → Builds screen and paste its
#      URL into Admin → Sites. It looks like
#      https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/<id> —
#      the CMS rejects a Pages hook pasted onto a Worker site (and vice versa).
#   4. Set the build-time environment variables on the trigger (Workers Builds
#      keeps them per trigger): PUBLIC_FLARE_API_URL, PUBLIC_FLARE_API_TOKEN and,
#      when content is scoped per site, PUBLIC_FLARE_SITE (the site slug
#      registered in Admin → Sites). Without PUBLIC_FLARE_SITE a build sees
#      shared content only once any site is registered.
#   5. Attach custom domains from Admin → Sites. A Worker can serve many
#      hostnames; the CMS binds them through the Workers custom-domains API.
#
# For a Pages-hosted site instead, the equivalent steps are: connect the Pages
# project to this Git repository (Direct Upload projects cannot be rebuilt by a
# Deploy Hook), set the build command / output directory, create a Deploy Hook
# and paste its URL into Admin → Sites.

