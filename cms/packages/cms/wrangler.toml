name = "flare-cms-dev"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers settings
workers_dev = true

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "my-astro-cms-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "./node_modules/@flare-cms/core/migrations"

# ---------------------------------------------------------------------------
# Media storage backend
#
# Which backend the CMS reads and writes is decided by STORAGE_BACKEND:
#   unset / "r2"  → Cloudflare R2 via the MEDIA_BUCKET binding (default)
#   "b2"          → Backblaze B2      (B2_* vars, S3-compatible API + SigV4)
#   "s3"          → any S3-compatible (S3_* vars: AWS S3, MinIO, Wasabi, R2 S3 API)
#
# The active provider is reported by GET /api/system/health and shown read-only
# in Admin → Settings → Storage. A selected backend with incomplete
# configuration fails with an explicit error naming the missing variables; it
# never silently falls back to R2.
# ---------------------------------------------------------------------------

# R2 bucket for media storage (default backend).
# Remove this block when STORAGE_BACKEND is "b2" or "s3" — `scripts/storage-config.py`
# does that automatically at deploy time.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-astro-cms-media"

# KV Namespace for rate limiting cache
[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Environment variables
[vars]
ENVIRONMENT = "development"
CORS_ORIGINS = "http://localhost:4321,http://localhost:8787"
MEDIA_DOMAIN = "images.flarecms.dev"

# Active storage backend. Leave unset (or "r2") to use the R2 binding above.
# Set to "b2" or "s3" to use an S3-compatible backend — deploy-time rewriting
# via scripts/storage-config.py fills in STORAGE_BACKEND and the provider vars.
# STORAGE_BACKEND = "b2"

# Backblaze B2 storage backend (STORAGE_BACKEND = "b2")
# B2_ENDPOINT: S3-compatible endpoint, e.g. https://s3.us-west-004.backblazeb2.com
# B2_BUCKET: your private bucket name
# B2_ACCESS_KEY_ID / B2_SECRET_ACCESS_KEY: application key from the B2 dashboard
# B2_REGION: bucket region, e.g. us-west-004 (default)
# B2_ENDPOINT = "https://s3.us-west-004.backblazeb2.com"
# B2_BUCKET = "arwes-cms-media"
# B2_ACCESS_KEY_ID = ""
# B2_SECRET_ACCESS_KEY = ""
# B2_REGION = "us-west-004"

# Generic S3-compatible backend (STORAGE_BACKEND = "s3")
# S3_ENDPOINT: optional — derived from S3_REGION for AWS S3 when omitted
# S3_FORCE_PATH_STYLE: "true" (default) for MinIO/B2, "false" for virtual-hosted
# S3_ENDPOINT = "https://s3.us-east-1.amazonaws.com"
# S3_BUCKET = "arwes-cms-media"
# S3_ACCESS_KEY_ID = ""
# S3_SECRET_ACCESS_KEY = ""
# S3_REGION = "us-east-1"
# S3_FORCE_PATH_STYLE = "true"

# Webhook configuration (Phase 4)
# Comma-separated URLs to POST on content publish/unpublish events
# Leave empty to disable webhooks; fill in a URL to test locally
WEBHOOK_URLS = ""
# Shared secret for HMAC-SHA256 webhook signatures
# Leave empty to send unsigned webhooks (a console.warn will be logged)
# Production values should be set in [env.production] below
WEBHOOK_SECRET = ""

# Production environment
[env.production]
name = "flare-cms"
vars = { ENVIRONMENT = "production", CORS_ORIGINS = "https://flare-site.pages.dev", MEDIA_DOMAIN = "images.flarecms.dev", WEBHOOK_URLS = "", WEBHOOK_SECRET = "", STORAGE_BACKEND = "", B2_ENDPOINT = "", B2_BUCKET = "", B2_ACCESS_KEY_ID = "", B2_SECRET_ACCESS_KEY = "", B2_REGION = "", S3_ENDPOINT = "", S3_BUCKET = "", S3_ACCESS_KEY_ID = "", S3_SECRET_ACCESS_KEY = "", S3_REGION = "", S3_FORCE_PATH_STYLE = "" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "my-astro-cms-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "./node_modules/@flare-cms/core/migrations"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-astro-cms-media"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Staging environment (migration testing)
[env.staging]
name = "flare-cms-staging"
vars = { ENVIRONMENT = "staging", CORS_ORIGINS = "http://localhost:4321,http://localhost:8787" }

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "my-astro-cms-db-staging"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "my-astro-cms-media"

# Cron triggers for scheduled content publishing
[triggers]
crons = ["* * * * *"]

# Observability
[observability]
enabled = true
